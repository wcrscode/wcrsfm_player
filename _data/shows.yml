  image: /assets/shows/the-electric-age-with-john-horan-hope-is-a-renewable-resource.jpg
  description: 'What if the greatest innovation of the modern age wasn''t the transistor or the moon rocket—but the belief that ordinary people could reinvent extraordinary lives?  In this Summer Solstice edition of The Electric Age, we journey through classic rock, archival visions of tomorrow, and the enduring optimism that shaped the Space Age. From satellites and science fiction to parks, highways, and shared humanity, this episode explores how music helped generations imagine a future worth building.  Featuring unforgettable performances from Bruce Springsteen, Electric Light Orchestra, The Beatles, Joni Mitchell, George Harrison, Supertramp, Donovan, Simon & Garfunkel, and more, this is a story about hope, curiosity, stewardship, and community.  Because technology may change the scenery—but humanity still writes the script.

    Keep the lights on. Hope is a renewable resource.'
