- key: /wcrs/the-electric-age-with-john-horan-the-dao-of-the-electric-age/
  name: The Electric Age with John Horan -- The Dao of The Electric Age
  url: https://www.mixcloud.com/wcrs/the-electric-age-with-john-horan-the-dao-of-the-electric-age/
  image: /assets/shows/the-electric-age-with-john-horan-the-dao-of-the-electric-age.jpg
  description: 'We revisit the quiet wisdom of Kwai Chang Caine and the Taoist principle of Wu-Wei—the idea that true strength comes not from forcing events, but from understanding the currents that shape them. What does the 1970s television series Kung Fu have to do with today''s headlines? More than you might think.. Through the lens of a television series that first introduced millions of Americans to Eastern philosophy, we decode today''s biggest stories.: Supreme Court decisions on immigration and executive power, tensions in the Strait of Hormuz, and even the Lincoln Memorial Reflecting Pool as a metaphor for seeing ourselves more clearly.

    Featuring music from The Beatles, The Rolling Stones, The Who, Elton John,  Grateful Dead, Janis Joplin, and more, The Electric Age connects yesterday''s soundtrack with today''s ideas—revealing the deeper patterns beneath the headlines.

    Don''t just watch the news. Decode it.'
