- key: /wcrs/the-electric-age-with-john-horan-the-season-of-abundance/
  name: The Electric Age with John Horan -- The Season of Abundance
  url: https://www.mixcloud.com/wcrs/the-electric-age-with-john-horan-the-season-of-abundance/
  image: /assets/shows/the-electric-age-with-john-horan-the-season-of-abundance.jpg
  description: 'In this episode of The Electric Age, John Horan explores "Summer: The Season of Abundance," contrasting a world consumed by conflict, rising prices, and political tension with the enduring gifts of sunshine, flowing rivers, shared music, and human connection. Woven together with classic rock from Santana, The Who, The Moody Blues, the Grateful Dead, and many others, the program invites listeners to trade fear for perspective and rediscover the healing power of nature, community, and the soundtrack of a summer well lived. This is not nostalgia—it''s an invitation to step outside and embrace the abundance that''s been waiting for us all along.'
