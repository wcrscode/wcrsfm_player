- key: /wcrs/the-electric-age-with-john-horan-21-out-of-office/
  name: 'The Electric Age with John Horan #21 - Out of Office'
  url: https://www.mixcloud.com/wcrs/the-electric-age-with-john-horan-21-out-of-office/
  image: /assets/shows/the-electric-age-with-john-horan-21-out-of-office.jpg
  description: 'T’s August. Time to get away.

    But what happens when the plans change — or the familiar patterns suddenly change themselves?

    In Out of Office, The Electric Age takes a musical road trip through planned and unexpected interruptions: summer vacations, the Great Northeast Blackout of 1965, unexpected storms, artificial intelligence, and the question of who really owns the time technology saves us.

    Featuring music from The Who, Canned Heat, Creedence Clearwater Revival, Led Zeppelin, Billy Joel, The Beatles, Sly & The Family Stone, and more.

    History tells us what happened. Music reminds us how it felt to people.

    The Electric Age, produced and hosted by John Horan.'
