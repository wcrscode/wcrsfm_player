  name: The Electric Age With John Horan -- "Reunion & Reinvention"
  url: https://www.mixcloud.com/wcrs/the-electric-age-with-john-horan-reunion-reinvention/
  image: /assets/shows/the-electric-age-with-john-horan-reunion-reinvention.jpg
  description: '🎙️ Reunion & Reinvention: What Do We Bring Forward? ⚡🌉

    Families reunite. Old friends reconnect. Nations heal. Humanity returns to the Moon. In this edition of The Electric Age, John Horan explores the deeper meaning of reunion—not as a return to the past, but as a chance to decide what deserves a future. From Germany''s reunification and the spirit of Woodstock to Apollo and Artemis, the Dalai Lama, and the music of Crosby, Stills & Nash, Simon & Garfunkel, and Seals & Crofts, this journey asks a timeless question: What do we carry forward? History meets tomorrow in a thoughtful exploration of friendship, reconciliation, memory, and hope.

    🌉 "What we call a reunion, history often calls a reinvention."'
