- key: /wcrs/the-electric-age-with-john-horan-when-yesterday-imagined-tomorrow/
  name: The Electric Age With John Horan -- "When Yesterday Imagined Tomorrow"
  url: https://www.mixcloud.com/wcrs/the-electric-age-with-john-horan-when-yesterday-imagined-tomorrow/
  image: /assets/shows/the-electric-age-with-john-horan-when-yesterday-imagined-tomorrow.jpg
  description: 'Future. Here. Now. — When Yesterday Imagined Tomorrow

    What happens when science fiction becomes everyday life? This edition of The Electric Age with John Horan travels from the imagined futures of Arthur C. Clarke and Isaac Asimov to satellites, computers, artificial intelligence, automation, and the economic choices facing us now. Along the way, children interviewed by the BBC in 1966 describe the world they expected to inherit—complete with space travel, computers, new forms of education, and the shadow of nuclear weapons. Featuring music from The Police, Stevie Nicks, David Bowie, The Beatles, Donald Fagen, and more, this is a journey through yesterday’s visions, today’s headlines, and the future we are still creating. Technology changes the scenery. Humanity writes the script. *Archival audio includes BBC interviews with children imagining life in the year 2000, recorded in 1966.*'
