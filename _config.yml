title: WCRS FM
description: Streaming community radio.
url: "https://wcrsfm.org"
baseurl: ""

markdown: kramdown
plugins: []

# Bump when assets/js/player.js changes to force browsers past DreamHost's 30-day cache.
player_js_version: 1

collections:
  articles:
    output: true
    permalink: /news/:path/
  programs:
    output: true
    permalink: /programs/:path/


include:
  - .htaccess

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .ddev
  - README.md
  - node_modules
  - mail_config.php
  - composer.json
  - composer.lock
  - data
  - deploy.sh
  - scripts
  - .deploy_state
  - admin_functions_for_wcrsfm.md
  - getschedulejson.py
  - show_audit.yml
